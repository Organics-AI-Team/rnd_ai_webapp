services:
  mongo:
    image: mongo:8.0.12
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (error) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}).ok
          }' | grep -q 1
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: "no"
    volumes:
      - commercial-mongo-data:/data/db
    networks:
      - commercial-test

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ': > /dev/tcp/127.0.0.1/6333'"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: "no"
    volumes:
      - commercial-qdrant-data:/qdrant/storage
    networks:
      - commercial-test

networks:
  commercial-test:
    driver: bridge

volumes:
  commercial-mongo-data:
  commercial-qdrant-data:
